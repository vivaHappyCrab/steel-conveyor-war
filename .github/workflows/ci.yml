name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore SteelConveyorWar.sln --locked-mode

      - name: Format check
        run: dotnet format SteelConveyorWar.sln --verify-no-changes --severity warn

      - name: Build
        run: dotnet build SteelConveyorWar.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test with coverage
        run: >
          dotnet test SteelConveyorWar.sln
          -c Release
          --no-build
          --logger trx
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Headless host smoke (no display)
        run: >
          dotnet run --project src/SteelConveyorWar.Headless
          -c Release
          --no-build
          -- --ticks 90

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-artifacts-${{ matrix.os }}
          path: |
            artifacts/test-results/**
            **/TestResults/**
            **/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  smoke-linux:
    name: sfml-smoke (ubuntu/xvfb)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxcursor1 libxrandr2 libxi6 libudev1

      - name: Restore and build client
        run: |
          dotnet restore SteelConveyorWar.sln --locked-mode
          dotnet build src/SteelConveyorWar.Client/SteelConveyorWar.Client.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Smoke test under Xvfb
        run: |
          xvfb-run -a dotnet run --project src/SteelConveyorWar.Client -c Release --no-build -- --smoke-test

  # R22: performance soft-gate (quick alloc/tick smoke). Hard thresholds via SCW_BENCH_HARD_GATE=1 after calibration.
  benchmark:
    name: benchmark-quick
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore and build benchmarks
        run: |
          dotnet restore tests/SteelConveyorWar.Benchmarks/SteelConveyorWar.Benchmarks.csproj --locked-mode
          dotnet build tests/SteelConveyorWar.Benchmarks/SteelConveyorWar.Benchmarks.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Quick tick/alloc matrix
        run: >
          dotnet run --project tests/SteelConveyorWar.Benchmarks
          -c Release
          --no-build
          -- --quick --json-out artifacts/benchmarks/results.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: benchmark-quick
          path: artifacts/benchmarks/**
          if-no-files-found: warn
          retention-days: 14

  pr-metadata:
    name: pr-metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require linked issue mention
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          text="${TITLE}"$'\n'"${BODY}"
          if ! echo "$text" | grep -Eiq '(fixes|closes|resolves)[[:space:]]*#[0-9]+|#[0-9]+'; then
            echo "PR must reference an issue (e.g. Fixes #123)."
            exit 1
          fi
          if ! echo "$BODY" | grep -Eiq 'Acceptance criteria|Test evidence|Risk'; then
            echo "PR body should include Acceptance criteria, Test evidence, and Risk sections (use the template)."
            exit 1
          fi
