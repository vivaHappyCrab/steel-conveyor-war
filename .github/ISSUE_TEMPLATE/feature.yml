name: Feature request
description: Propose an MVP feature or improvement with Definition of Ready
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What player or engineering problem are we solving?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of observable outcomes
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicitly out of scope for this issue
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      value: |
        ```powershell
        pwsh eng/verify.ps1
        ```
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        After DoR is complete, an owner may add the `ai-ready` label.
